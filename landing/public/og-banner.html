<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Relay — OG banner source (1200×630)</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        background: #f7f3e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        color: #181818;
        padding: 74px 84px;
      }
      .bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url('/bg.jpg') center / cover no-repeat;
        opacity: 0.13;
        filter: saturate(0.25) contrast(0.4) brightness(1.7);
      }
      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand img { width: 52px; height: 52px; border-radius: 11px; }
      .brand span { font-size: 30px; font-weight: 750; letter-spacing: -0.01em; }
      h1 {
        font-size: 104px;
        line-height: 0.93;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .lede {
        margin-top: 24px;
        font-size: 31px;
        line-height: 1.38;
        color: #38352f;
        max-width: 26ch;
      }
      .chip {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        background: #181818;
        color: #c8f7d4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 23px;
        padding: 13px 20px;
        border-radius: 11px;
      }
      .chip b { color: #fffdf6; font-weight: 600; }
      .chip .arrow { color: #9a937f; margin: 0 12px; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="content">
      <div class="brand">
        <img src="/icon-128.png" alt="" />
        <span>Chrome Relay</span>
      </div>
      <div>
        <h1>Terminal to Chrome.</h1>
        <p class="lede">Your agent drives the Chrome you're already signed into. Nothing leaves the machine.</p>
      </div>
      <div class="chip">$ chrome-relay&nbsp;<b>tabs</b><span class="arrow">→</span>your real Chrome</div>
    </div>
  </body>
</html>
