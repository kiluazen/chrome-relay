<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Relay — OG banner source (1200×630)</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        background: #f7f3e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        color: #181818;
      }
      /* Same engraving wallpaper as the landing (.bg-art). */
      .bg {
        position: absolute;
        inset: 0;
        background: url('/bg.jpg') center / cover no-repeat;
        opacity: 0.22;
        filter: saturate(0.25) contrast(0.4) brightness(1.7);
      }
      .brand {
        position: absolute;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 13px;
        z-index: 2;
      }
      .brand img { width: 46px; height: 46px; border-radius: 10px; }
      .brand span { font-size: 27px; font-weight: 750; letter-spacing: -0.01em; }
      .center {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        text-align: center;
        padding: 0 80px;
      }
      h1 {
        font-size: 98px;
        line-height: 0.95;
        font-weight: 800;
        letter-spacing: -0.045em;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        background: #181818;
        color: #c8f7d4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 25px;
        padding: 14px 22px;
        border-radius: 12px;
      }
      .chip .dim { color: #6f9c82; }
      .chip b { color: #fffdf6; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="brand">
      <img src="/icon-128.png" alt="" />
      <span>Chrome Relay</span>
    </div>
    <div class="center">
      <h1>Terminal to Chrome.</h1>
      <div class="chip"><span class="dim">$</span>&nbsp;chrome-relay click&nbsp;<b>--x 640 --y 312</b></div>
    </div>
  </body>
</html>
